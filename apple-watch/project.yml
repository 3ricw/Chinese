name: EricsChineseWrist
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    # Set DEVELOPMENT_TEAM in Xcode for BOTH targets before running on devices.
targets:
  EricsChinesePhone:
    type: application
    platform: iOS
    sources: [Shared, Phone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericschinese.wrist
        INFOPLIST_KEY_CFBundleDisplayName: "Eric’s Chinese"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
    scheme: {}
  EricsChineseWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericschinese.wrist.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: "Eric’s Chinese"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ericschinese.wrist
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: 4
    scheme: {}
# Two explicit run schemes are used for local development. Install each target
# on the paired simulator/devices. App Store embedding/signing is not configured.
