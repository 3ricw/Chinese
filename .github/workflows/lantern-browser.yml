name: Chinese learning app browser checks
on:
  push:
    branches: [main, 'qa/lantern-*']
    paths:
      - index.html
      - 'assets/**'
      - 'tests/lantern-*'
      - '.github/workflows/lantern-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check lesson state and progress
        run: node tests/lantern-lane.cjs
      - name: Test phone and desktop interactions with the packaged browsers
        run: |
          docker run --rm --init --shm-size=1g \
            --volume "$GITHUB_WORKSPACE:/app" --workdir /app \
            mcr.microsoft.com/playwright/python:v1.57.0-noble \
            sh -ec '
              python -m pip install --disable-pip-version-check playwright==1.57.0
              python tests/lantern-browser.py --browser chromium
              python tests/lantern-browser.py --browser webkit
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-browser-screenshots
          path: tests/results/browser
          retention-days: 7
  published-page:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published release on GitHub Pages
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import urlopen
          site = 'https://3ricw.github.io/Chinese/'
          sha = os.environ['RELEASE_SHA']
          expected = Path('index.html').read_bytes()
          for attempt in range(30):
              try:
                  with urlopen(f'{site}?release={sha}&check={attempt}', timeout=10) as response:
                      if response.read() == expected:
                          break
              except (TimeoutError, URLError):
                  pass
              time.sleep(10)
          else:
              raise SystemExit('The published entry point did not match the release commit.')
          assets = set(re.findall(r'(?:src|href)="(assets/[^"]+)"', expected.decode()))
          for css in (Path(p) for p in tuple(assets) if p.endswith('.css')):
              assets.update((css.parent / f).as_posix() for f in re.findall(r'url\("(lantern-[^"]+\.webp)"\)', css.read_text()))
          def verify(path):
              with urlopen(site + path, timeout=15) as response:
                  if response.read() != Path(path).read_bytes():
                      raise ValueError(f'Published asset differs: {path}')
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(verify, sorted(assets)))
          print(f'GitHub Pages serves {sha}, including all {len(assets)} verified assets.')
          PY
